name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  build:
    name: Docker Standalone Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: amellify:ci-test

  e2e:
    name: E2E Tests (Playwright & Docker Compose)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env from template
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            cat << 'EOF' > .env
            BETTER_AUTH_SECRET=ci-e2e-secret-key-must-be-at-least-32-chars-long
            BETTER_AUTH_URL=http://localhost:3000
            POSTGRES_USER=amellify
            POSTGRES_PASSWORD=amellify
            POSTGRES_DB=amellify
            DATABASE_URL=postgresql://amellify:amellify@localhost:5432/amellify
            EOF
          fi

      - name: Start Database and Run Migrations
        run: |
          docker compose up -d db
          docker compose run --rm migrate

      - name: Start App and Wait for It to Be Healthy
        # `--wait` blocks on the container's own healthcheck
        # (docker-compose.yml: /api/health, 15s interval x 5 retries, 20s
        # start_period) and FAILS the step if it never turns healthy,
        # instead of a manual polling loop that fell through silently on
        # timeout and let a broken app run straight into the e2e suite
        # (found by /code-review).
        run: docker compose up -d --wait app

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          CI: 'true'
        run: pnpm test:e2e --project=chromium

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Teardown Docker Compose
        if: always()
        run: docker compose down -v
